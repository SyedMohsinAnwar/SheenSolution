<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="SheenSolution builds customized AI solutions that help businesses manage customer support, sales, orders, and after-sales service 24/7."
  >

  <title>SheenSolution | Smarter Business with AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #16a34a;
      --primary-dark: #15803d;
      --dark: #1f2937;
      --gray: #6b7280;
      --light: #f9fafb;
      --border: #e5e7eb;
      --white: #ffffff;
      --soft-green: #f0fdf4;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      color: var(--dark);
      line-height: 1.6;
      background: var(--white);
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--primary);
    }

    nav {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    nav a {
      font-size: 14px;
      font-weight: 500;
      color: var(--gray);
    }

    nav a:hover {
      color: var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--primary);
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn-outline {
      color: var(--primary);
      background: white;
    }

    .btn-outline:hover {
      background: var(--light);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      padding: 80px 0 60px;
      background: linear-gradient(
        135deg,
        #ffffff 0%,
        #f0fdf4 100%
      );
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 48px;
      align-items: center;
    }

    .hero-tag {
      display: inline-block;
      background: rgba(22, 163, 74, 0.1);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: clamp(36px, 6vw, 56px);
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 20px;
      color: var(--dark);
    }

    h1 span {
      color: var(--primary);
    }

    .hero-desc {
      font-size: 16px;
      color: var(--gray);
      max-width: 520px;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .trust-badges {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray);
    }

    .trust-badges span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* =========================
       IPHONE VISUAL
    ========================= */

    .visual-demo {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 420px;
    }

    .phone-frame {
      width: 280px;
      height: 610px;
      background: linear-gradient(
        145deg,
        #1f2937,
        #0f172a 45%,
        #374151
      );
      border: 3px solid #4b5563;
      border-radius: 48px;
      padding: 9px;
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      position: relative;
      z-index: 10;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 27px;
      background: #000;
      border-radius: 20px;
      z-index: 30;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .dynamic-island::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      background: #111827;
      border-radius: 50%;
      right: 14px;
      top: 10px;
      box-shadow: inset 0 0 2px #4b5563;
    }

    /* Side buttons */
    .phone-frame::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 145px;
      width: 3px;
      height: 45px;
      background: #6b7280;
      border-radius: 3px;
      box-shadow:
        0 58px 0 #6b7280,
        0 88px 0 #6b7280;
    }

    .phone-frame::after {
      content: "";
      position: absolute;
      right: -5px;
      top: 170px;
      width: 3px;
      height: 80px;
      background: #6b7280;
      border-radius: 3px;
    }

    .phone-screen {
      background: white;
      border-radius: 39px;
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chat-header {
      background: var(--primary);
      color: white;
      padding: 50px 16px 14px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .chat-status {
      display: block;
      font-size: 10px;
      opacity: 0.9;
      margin-top: 2px;
      font-weight: 400;
    }

    .chat-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 82%;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.4;
    }

    .msg-in {
      background: white;
      border: 1px solid var(--border);
      align-self: flex-start;
    }

    .msg-out {
      background: #e8f5e9;
      align-self: flex-end;
      color: var(--dark);
    }

    .typing {
      width: fit-content;
      background: white;
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: var(--gray);
    }

    .feature-badge {
      position: absolute;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--primary);
    }

    .feature-badge::before {
      content: "✓";
      font-weight: 700;
    }

    .badge-1 {
      top: 30px;
      left: -80px;
    }

    .badge-2 {
      bottom: 40px;
      right: -90px;
    }

    /* =========================
       GENERAL SECTIONS
    ========================= */

    section {
      padding: 72px 0;
    }

    .section-header {
      text-align: center;
      max-width: 650px;
      margin: 0 auto 48px;
    }

    h2 {
      font-size: clamp(28px, 4vw, 44px);
      margin-bottom: 12px;
      color: var(--dark);
      letter-spacing: -0.5px;
    }

    .section-desc {
      font-size: 16px;
      color: var(--gray);
      line-height: 1.7;
    }

    .highlight {
      color: var(--primary);
    }

    /* =========================
       FEATURES
    ========================= */

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
    }

    .feature-card {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      transition: all 0.3s ease;
    }

    .feature-card:hover {
      border-color: var(--primary);
      box-shadow: 0 12px 24px rgba(22, 163, 74, 0.08);
      transform: translateY(-3px);
    }

    .feature-icon {
      width: 44px;
      height: 44px;
      background: rgba(22, 163, 74, 0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 16px;
      color: var(--primary);
    }

    .feature-card h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--dark);
    }

    .feature-card p {
      font-size: 14px;
      color: var(--gray);
      line-height: 1.6;
    }

    /* =========================
       VISION
    ========================= */

    .vision-section {
      background: var(--soft-green);
    }

    .vision-box {
      max-width: 800px;
      margin: auto;
      text-align: center;
    }

    .vision-box h2 {
      margin-bottom: 18px;
    }

    .vision-box p {
      color: var(--gray);
      font-size: 16px;
      line-height: 1.8;
    }

    .vision-quote {
      margin-top: 24px;
      font-size: 20px;
      font-weight: 700;
      color: var(--dark);
    }

    /* =========================
       BUILT AROUND BUSINESS
    ========================= */

    .business-section {
      background: white;
    }

    .business-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
    }

    .business-content h2 {
      margin-bottom: 16px;
    }

    .business-content p {
      color: var(--gray);
      margin-bottom: 20px;
      line-height: 1.8;
    }

    .check-list {
      list-style: none;
      display: grid;
      gap: 12px;
    }

    .check-list li {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
    }

    .check-list li::before {
      content: "✓";
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 163, 74, 0.1);
      color: var(--primary);
      flex-shrink: 0;
    }

    .business-card {
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
    }

    .business-card h3 {
      margin-bottom: 18px;
    }

    .business-pill {
      display: inline-block;
      padding: 8px 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 5px;
      font-size: 13px;
      color: var(--gray);
    }

    /* =========================
       HOW IT WORKS
    ========================= */

    .how-it-works {
      background: var(--light);
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 32px;
    }

    .step {
      text-align: center;
    }

    .step-number {
      width: 48px;
      height: 48px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      margin: 0 auto 16px;
    }

    .step h3 {
      font-size: 16px;
      margin-bottom: 8px;
      color: var(--dark);
    }

    .step p {
      font-size: 14px;
      color: var(--gray);
      line-height: 1.6;
    }

    /* =========================
       HUMAN + AI
    ========================= */

    .human-ai {
      text-align: center;
    }

    .human-ai-content {
      max-width: 720px;
      margin: auto;
    }

    .human-ai-content p {
      color: var(--gray);
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .ai-badge {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 30px;
      background: var(--soft-green);
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 14px;
    }

    /* =========================
       CONTACT FORM
    ========================= */

    .contact-section {
      background: var(--light);
    }

    .contact-wrapper {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 40px;
      align-items: start;
    }

    .contact-info h2 {
      margin-bottom: 15px;
    }

    .contact-info p {
      color: var(--gray);
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .contact-point {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--dark);
      font-weight: 600;
    }

    .contact-point span {
      color: var(--primary);
    }

    .contact-form {
      background: white;
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
      color: var(--dark);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 12px;
      outline: none;
      background: white;
      color: var(--dark);
      transition: border-color 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--gray);
    }

    .checkbox-item input {
      accent-color: var(--primary);
    }

    .form-submit {
      width: 100%;
      border: none;
      margin-top: 5px;
    }

    .form-note {
      font-size: 11px;
      color: var(--gray);
      text-align: center;
      margin-top: 10px;
    }

    /* =========================
       CTA
    ========================= */

    .cta-section {
      padding: 48px 0;
    }

    .cta-box {
      background: linear-gradient(
        135deg,
        var(--dark) 0%,
        #0f172a 100%
      );
      color: white;
      border-radius: 16px;
      padding: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .cta-box h2 {
      color: white;
      font-size: 36px;
      margin-bottom: 12px;
    }

    .cta-box p {
      color: #d1d5db;
      font-size: 15px;
      max-width: 480px;
      line-height: 1.7;
    }

    .cta-buttons {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #111827;
      color: #9ca3af;
      padding: 40px 0 20px;
      font-size: 14px;
    }

    .footer-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-brand {
      font-size: 18px;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 768px) {
      nav {
        display: none;
      }

      .hero-grid,
      .business-grid,
      .contact-wrapper {
        grid-template-columns: 1fr;
      }

      .visual-demo {
        min-height: 320px;
        margin-top: 20px;
      }

      .phone-frame {
        width: 220px;
        height: 480px;
        border-radius: 40px;
      }

      .phone-screen {
        border-radius: 32px;
      }

      .dynamic-island {
        width: 75px;
        height: 23px;
        top: 12px;
      }

      .chat-header {
        padding-top: 40px;
      }

      .badge-1,
      .badge-2 {
        display: none;
      }

      .features-grid {
        grid-template-columns: 1fr;
      }

      .steps-grid {
        grid-template-columns: 1fr 1fr;
      }

      .cta-box {
        flex-direction: column;
        padding: 32px;
        text-align: left;
      }

      .cta-box h2 {
        font-size: 28px;
      }

      .cta-buttons {
        width: 100%;
      }

      .cta-buttons .btn {
        flex: 1;
      }

      .footer-content {
        flex-direction: column;
        text-align: left;
        align-items: flex-start;
      }

      section {
        padding: 48px 0;
      }

      h1 {
        font-size: 32px;
      }

      h2 {
        font-size: 28px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 0 16px;
      }

      .hero {
        padding: 48px 0 32px;
      }

      .hero-buttons {
        flex-direction: column;
      }

      .hero-buttons .btn {
        width: 100%;
      }

      h1 {
        font-size: 28px;
      }

      .hero-desc {
        font-size: 15px;
      }

      .trust-badges {
        flex-direction: column;
        gap: 12px;
      }

      .steps-grid {
        grid-template-columns: 1fr;
      }

      .section-header {
        margin-bottom: 32px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .checkbox-grid {
        grid-template-columns: 1fr;
      }

      .contact-form {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>
    <div class="container header-inner">

      <div class="logo">
        Sheen<span>Solution</span>
      </div>

      <nav>
        <a href="#features">Solutions</a>
        <a href="#how">How It Works</a>
        <a href="#vision">Our Vision</a>
        <a href="#contact">Contact</a>
      </nav>

      <a class="btn btn-primary" href="#contact">
        Get Started
      </a>

    </div>
  </header>


  <main>

    <!-- =========================
         HERO
    ========================= -->

    <section class="hero">

      <div class="container">

        <div class="hero-grid">

          <div>

            <div class="hero-tag">
              AI-Powered Business Solutions
            </div>

            <h1>
              Your Business.<br>
              <span>Smarter with AI.</span>
            <
